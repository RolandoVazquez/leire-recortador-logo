<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leire - Recortador & Creador de Logos</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf2f8',
                            500: '#e0247e',
                            600: '#ff2a85',
                            700: '#c2185b',
                            dark: '#121214',
                            card: '#1e1e24',
                            border: '#2a2a35'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbars & Touch behaviors */
        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Transparency Checkerboard Background */
        .checkerboard {
            background-color: #1a1a20;
            background-image: 
                linear-gradient(45deg, #252530 25%, transparent 25%), 
                linear-gradient(-45deg, #252530 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #252530 75%), 
                linear-gradient(-45deg, transparent 75%, #252530 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        /* Custom styled Range Inputs */
        input[type=range] {
            -webkit-appearance: none;
            background: #2a2a35;
            height: 6px;
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #ff2a85;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 42, 133, 0.5);
        }
    </style>
</head>
<body class="bg-brand-dark text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="h-14 border-b border-brand-border bg-brand-card/80 backdrop-blur-md px-4 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-500 to-brand-600 flex items-center justify-center text-white font-bold shadow-lg shadow-brand-500/30">
                <i class="fa-solid fa-crop-simple text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-wide flex items-center gap-2">
                    Leire <span class="text-xs bg-brand-500/20 text-brand-600 px-2 py-0.5 rounded-full border border-brand-500/30 font-medium">Logo Crop</span>
                </h1>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="btnUploadNew" class="hidden sm:flex items-center gap-2 bg-brand-border hover:bg-gray-700 text-xs px-3 py-1.5 rounded-lg transition-all">
                <i class="fa-solid fa-folder-open"></i> Cambiar Imagen
            </button>
            <button id="btnExport" class="bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white font-medium text-xs px-4 py-2 rounded-lg shadow-lg shadow-brand-500/20 flex items-center gap-2 transition-all active:scale-95">
                <i class="fa-solid fa-download"></i> Exportar
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 relative flex flex-col md:flex-row overflow-hidden">

        <!-- Central Canvas Interactive Container -->
        <div id="canvasContainer" class="flex-1 relative checkerboard flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing">
            
            <!-- Default Upload View (Empty State) -->
            <div id="uploadPlaceholder" class="text-center p-6 max-w-sm mx-auto z-10 bg-brand-card/90 backdrop-blur-lg border border-brand-border rounded-2xl shadow-2xl">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-brand-500/10 border border-brand-500/20 flex items-center justify-center text-brand-600 text-2xl">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <h2 class="text-lg font-semibold mb-1">Sube tu Isotipo / Logo</h2>
                <p class="text-xs text-gray-400 mb-5">Recorta fondos indeseados con formas perfectas (Círculo, Óvalo, Cuadrado) sin perder calidad.</p>
                <label for="imageFileInput" class="cursor-pointer inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm px-5 py-2.5 rounded-xl shadow-lg shadow-brand-600/30 transition-all hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-image"></i> Seleccionar Imagen
                </label>
                <input type="file" id="imageFileInput" accept="image/*" class="hidden">
            </div>

            <!-- Workspace HTML5 Canvas -->
            <canvas id="workspaceCanvas" class="absolute inset-0 m-auto hidden z-0"></canvas>

            <!-- On-Canvas Quick Floating Controls -->
            <div id="canvasQuickControls" class="absolute top-4 left-4 z-10 flex items-center gap-2 bg-brand-card/90 backdrop-blur-md p-1.5 rounded-xl border border-brand-border shadow-xl hidden">
                <button id="btnZoomIn" class="w-8 h-8 rounded-lg hover:bg-brand-border flex items-center justify-center text-gray-300 transition-colors" title="Acercar">
                    <i class="fa-solid fa-magnifying-glass-plus text-xs"></i>
                </button>
                <button id="btnZoomOut" class="w-8 h-8 rounded-lg hover:bg-brand-border flex items-center justify-center text-gray-300 transition-colors" title="Alejar">
                    <i class="fa-solid fa-magnifying-glass-minus text-xs"></i>
                </button>
                <button id="btnResetView" class="w-8 h-8 rounded-lg hover:bg-brand-border flex items-center justify-center text-gray-300 transition-colors" title="Centrar e Imagen Original">
                    <i class="fa-solid fa-rotate-left text-xs"></i>
                </button>
            </div>

            <!-- Live Center Guide Line Indicator Badge -->
            <div id="centerGuideBadge" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 bg-brand-500/90 text-white text-[10px] font-semibold px-3 py-1 rounded-full shadow-lg border border-brand-600 opacity-0 transition-opacity pointer-events-none flex items-center gap-1.5">
                <i class="fa-solid fa-bullseye"></i> Centrado Perfecto
            </div>
        </div>

        <!-- Sidebar / Bottom Controls Panel -->
        <aside id="controlsPanel" class="w-full md:w-80 bg-brand-card/95 border-t md:border-t-0 md:border-l border-brand-border flex flex-col z-20 shrink-0 max-h-[50vh] md:max-h-full overflow-y-auto">
            <div class="p-4 border-b border-brand-border/60 flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Ajustes de Recorte</span>
                <button id="btnMobileUpload" class="sm:hidden text-xs text-brand-600 hover:underline">
                    <i class="fa-solid fa-upload"></i> Cambiar
                </button>
            </div>

            <div class="p-4 space-y-5 flex-1">
                <!-- 1. Frame Shape Selection -->
                <div>
                    <label class="block text-xs font-semibold mb-2 text-gray-300">Forma del Marco</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button data-shape="circle" class="shape-btn active p-2.5 rounded-xl border border-brand-500 bg-brand-500/10 text-brand-600 flex flex-col items-center gap-1 transition-all">
                            <i class="fa-regular fa-circle text-base"></i>
                            <span class="text-[10px] font-medium">Círculo</span>
                        </button>
                        <button data-shape="oval" class="shape-btn p-2.5 rounded-xl border border-brand-border bg-brand-dark/40 text-gray-400 hover:text-gray-200 flex flex-col items-center gap-1 transition-all">
                            <i class="fa-solid fa-egg text-base"></i>
                            <span class="text-[10px] font-medium">Óvalo</span>
                        </button>
                        <button data-shape="square" class="shape-btn p-2.5 rounded-xl border border-brand-border bg-brand-dark/40 text-gray-400 hover:text-gray-200 flex flex-col items-center gap-1 transition-all">
                            <i class="fa-regular fa-square text-base"></i>
                            <span class="text-[10px] font-medium">Cuadrado</span>
                        </button>
                        <button data-shape="rect" class="shape-btn p-2.5 rounded-xl border border-brand-border bg-brand-dark/40 text-gray-400 hover:text-gray-200 flex flex-col items-center gap-1 transition-all">
                            <i class="fa-regular fa-rectangle-wide text-base"></i>
                            <span class="text-[10px] font-medium">16:9</span>
                        </button>
                    </div>
                </div>

                <!-- 2. Smooth Edges / Anti-aliasing Slider -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="text-xs font-semibold text-gray-300">Suavizado de Bordes</label>
                        <span id="featherValue" class="text-[11px] text-brand-600 font-mono">0 px</span>
                    </div>
                    <input type="range" id="featherSlider" min="0" max="25" value="0" class="w-full">
                </div>

                <!-- 3. Centering & Alignment Helper -->
                <div class="flex items-center justify-between pt-1 border-t border-brand-border/40">
                    <span class="text-xs font-semibold text-gray-300">Guías de Alineación</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggleGuides" class="sr-only peer" checked>
                        <div class="w-9 h-5 bg-brand-border peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-brand-600"></div>
                    </label>
                </div>

                <!-- 4. Background Preview Modes -->
                <div>
                    <label class="block text-xs font-semibold mb-2 text-gray-300">Fondo de Previsualización</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button data-bg="checker" class="bg-btn active py-2 rounded-lg border border-brand-500 bg-brand-500/10 text-xs text-brand-600 font-medium text-center">
                            Damero
                        </button>
                        <button data-bg="dark" class="bg-btn py-2 rounded-lg border border-brand-border bg-black text-xs text-gray-300 font-medium text-center">
                            Oscuro
                        </button>
                        <button data-bg="light" class="bg-btn py-2 rounded-lg border border-brand-border bg-white text-black text-xs font-medium text-center">
                            Claro
                        </button>
                        <button data-bg="red" class="bg-btn py-2 rounded-lg border border-brand-border bg-red-600 text-white text-xs font-medium text-center">
                            Rojo
                        </button>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Export Modal -->
    <div id="exportModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity">
        <div class="bg-brand-card border border-brand-border w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <button id="btnCloseModal" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-lg font-bold mb-1">Exportar Logo Ultra HD</h3>
            <p class="text-xs text-gray-400 mb-4">Elige el formato y conserva el 100% de la densidad de píxeles original.</p>

            <div class="space-y-4">
                <!-- Export Format -->
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Formato de Archivo</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border border-brand-border hover:border-brand-500 rounded-xl p-3 flex items-center gap-3 cursor-pointer bg-brand-dark/40 has-[:checked]:border-brand-500 has-[:checked]:bg-brand-500/10">
                            <input type="radio" name="exportFormat" value="png" checked class="text-brand-600 focus:ring-0">
                            <div>
                                <div class="text-xs font-bold">PNG (.png)</div>
                                <div class="text-[10px] text-gray-400">Transparencia HD Nativa</div>
                            </div>
                        </label>
                        <label class="border border-brand-border hover:border-brand-500 rounded-xl p-3 flex items-center gap-3 cursor-pointer bg-brand-dark/40 has-[:checked]:border-brand-500 has-[:checked]:bg-brand-500/10">
                            <input type="radio" name="exportFormat" value="ico" class="text-brand-600 focus:ring-0">
                            <div>
                                <div class="text-xs font-bold">Ícono (.ico)</div>
                                <div class="text-[10px] text-gray-400">Ideal Favicon / App</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Export Size -->
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Resolución de Salida</label>
                    <select id="exportSizeSelect" class="w-full bg-brand-dark border border-brand-border rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-brand-500">
                        <option value="native" selected>Resolución Nativa Original (Ultra Nitidez)</option>
                        <option value="2048">2048 x 2048 px (4K Ultra HD)</option>
                        <option value="1024">1024 x 1024 px (Alta Definición)</option>
                        <option value="512">512 x 512 px (Estándar App / Redes)</option>
                        <option value="256">256 x 256 px (Favicon / Avatar)</option>
                    </select>
                </div>

                <!-- Action Button -->
                <button id="btnConfirmDownload" class="w-full mt-2 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white font-medium text-sm py-3 rounded-xl shadow-lg shadow-brand-500/30 flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-download"></i> Descargar Imagen HD
                </button>
            </div>
        </div>
    </div>

    <!-- Application Engine JavaScript -->
    <script>
        // Global Application State
        const state = {
            image: null,
            imageLoaded: false,
            shape: 'circle', // circle, oval, square, rect
            feather: 0,
            showGuides: true,
            bgPreview: 'checker', // checker, dark, light, red
            // Canvas View Transform
            zoom: 1,
            panX: 0,
            panY: 0,
            // Touch tracking
            isDragging: false,
            startX: 0,
            startY: 0,
            initialPinchDist: 0,
            initialZoom: 1,
            isCentered: false
        };

        // DOM Elements
        const canvas = document.getElementById('workspaceCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        const fileInput = document.getElementById('imageFileInput');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const quickControls = document.getElementById('canvasQuickControls');
        const centerBadge = document.getElementById('centerGuideBadge');

        // Initialize Canvas Resize Observer
        window.addEventListener('resize', handleResize);

        function handleResize() {
            if (!state.imageLoaded) return;
            setupCanvasDimensions();
            render();
        }

        // Image Load Handler
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    state.image = img;
                    state.imageLoaded = true;
                    // Reset View Transforms
                    state.zoom = 1;
                    state.panX = 0;
                    state.panY = 0;

                    // Update UI
                    uploadPlaceholder.classList.add('hidden');
                    canvas.classList.remove('hidden');
                    quickControls.classList.remove('hidden');

                    setupCanvasDimensions();
                    render();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Calculate Canvas Display Boundaries adjusted for High-DPI screens
        function setupCanvasDimensions() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
        }

        // Render Loop for Live UI Preview Only
        function render() {
            if (!state.imageLoaded) return;

            const dpr = window.devicePixelRatio || 1;
            const width = canvas.width;
            const height = canvas.height;

            // Enable High Quality Image Smoothing for preview
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            // Clear Background
            ctx.clearRect(0, 0, width, height);

            // Mask Dimensions
            let maskW = Math.min(width, height) * 0.65;
            let maskH = maskW;

            if (state.shape === 'oval') {
                maskW = width * 0.7;
                maskH = height * 0.45;
            } else if (state.shape === 'rect') {
                maskW = width * 0.75;
                maskH = maskW * (9 / 16);
            }

            const maskX = (width - maskW) / 2;
            const maskY = (height - maskH) / 2;

            // Draw Background Color Preview if selected
            if (state.bgPreview !== 'checker') {
                ctx.save();
                ctx.fillStyle = state.bgPreview === 'dark' ? '#000000' : state.bgPreview === 'light' ? '#ffffff' : '#dc2626';
                ctx.fillRect(0, 0, width, height);
                ctx.restore();
            }

            // Draw Dark Overlay outside the mask
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(0, 0, width, height);

            // Cut Out Mask Area
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            drawMaskShape(ctx, maskX, maskY, maskW, maskH, state.shape);
            
            if (state.feather > 0) {
                ctx.filter = `blur(${state.feather * dpr}px)`;
            }
            ctx.fill();
            ctx.restore();

            // Draw Image inside Mask using Clipping
            ctx.save();
            ctx.beginPath();
            drawMaskShape(ctx, maskX, maskY, maskW, maskH, state.shape);
            ctx.clip();

            // Apply Image Transformations (Pan & Zoom)
            const centerX = width / 2 + (state.panX * dpr);
            const centerY = height / 2 + (state.panY * dpr);
            const imgAspect = state.image.width / state.image.height;

            let drawW = maskW * state.zoom;
            let drawH = drawW / imgAspect;

            if (drawH < maskH * state.zoom) {
                drawH = maskH * state.zoom;
                drawW = drawH * imgAspect;
            }

            ctx.drawImage(
                state.image, 
                centerX - drawW / 2, 
                centerY - drawH / 2, 
                drawW, 
                drawH
            );
            ctx.restore();

            // Draw Mask Border Line
            ctx.save();
            ctx.strokeStyle = state.isCentered ? '#ff2a85' : '#ffffff';
            ctx.lineWidth = (state.isCentered ? 3 : 1.5) * dpr;
            ctx.beginPath();
            drawMaskShape(ctx, maskX, maskY, maskW, maskH, state.shape);
            ctx.stroke();
            ctx.restore();

            // Draw Alignment Guides if enabled
            if (state.showGuides) {
                ctx.save();
                ctx.strokeStyle = state.isCentered ? '#ff2a85' : 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1 * dpr;
                ctx.setLineDash([4 * dpr, 4 * dpr]);

                // Crosshair at Center
                ctx.beginPath();
                ctx.moveTo(width / 2, maskY);
                ctx.lineTo(width / 2, maskY + maskH);
                ctx.moveTo(maskX, height / 2);
                ctx.lineTo(maskX + maskW, height / 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        // Helper: Draw Mask Shapes
        function drawMaskShape(context, x, y, w, h, shape) {
            if (shape === 'circle') {
                const radius = Math.min(w, h) / 2;
                context.arc(x + w / 2, y + h / 2, radius, 0, Math.PI * 2);
            } else if (shape === 'oval') {
                context.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
            } else if (shape === 'square' || shape === 'rect') {
                context.rect(x, y, w, h);
            }
        }

        // Interactive Touch & Mouse Event Listeners
        container.addEventListener('mousedown', (e) => {
            if (!state.imageLoaded) return;
            state.isDragging = true;
            state.startX = e.clientX - state.panX;
            state.startY = e.clientY - state.panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!state.isDragging) return;
            state.panX = e.clientX - state.startX;
            state.panY = e.clientY - state.startY;

            // Check Center Snapping (< 8px threshold)
            if (Math.abs(state.panX) < 8 && Math.abs(state.panY) < 8) {
                state.panX = 0;
                state.panY = 0;
                state.isCentered = true;
                centerBadge.style.opacity = '1';
            } else {
                state.isCentered = false;
                centerBadge.style.opacity = '0';
            }

            render();
        });

        window.addEventListener('mouseup', () => {
            state.isDragging = false;
        });

        // Mouse Wheel Zoom
        container.addEventListener('wheel', (e) => {
            if (!state.imageLoaded) return;
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            state.zoom = Math.max(0.5, Math.min(4, state.zoom + delta));
            render();
        }, { passive: false });

        // Touch Events for Mobile
        container.addEventListener('touchstart', (e) => {
            if (!state.imageLoaded) return;
            if (e.touches.length === 1) {
                state.isDragging = true;
                state.startX = e.touches[0].clientX - state.panX;
                state.startY = e.touches[0].clientY - state.panY;
            } else if (e.touches.length === 2) {
                state.isDragging = false;
                state.initialPinchDist = getTouchDist(e.touches);
                state.initialZoom = state.zoom;
            }
        });

        container.addEventListener('touchmove', (e) => {
            if (!state.imageLoaded) return;
            if (e.touches.length === 1 && state.isDragging) {
                state.panX = e.touches[0].clientX - state.startX;
                state.panY = e.touches[0].clientY - state.startY;

                if (Math.abs(state.panX) < 8 && Math.abs(state.panY) < 8) {
                    state.panX = 0;
                    state.panY = 0;
                    state.isCentered = true;
                    centerBadge.style.opacity = '1';
                } else {
                    state.isCentered = false;
                    centerBadge.style.opacity = '0';
                }
                render();
            } else if (e.touches.length === 2) {
                const dist = getTouchDist(e.touches);
                const scale = dist / state.initialPinchDist;
                state.zoom = Math.max(0.5, Math.min(4, state.initialZoom * scale));
                render();
            }
        });

        container.addEventListener('touchend', () => {
            state.isDragging = false;
        });

        function getTouchDist(touches) {
            return Math.hypot(
                touches[0].clientX - touches[1].clientX,
                touches[0].clientY - touches[1].clientY
            );
        }

        // Controls Bindings
        document.querySelectorAll('.shape-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.shape-btn').forEach(b => {
                    b.classList.remove('active', 'border-brand-500', 'bg-brand-500/10', 'text-brand-600');
                    b.classList.add('border-brand-border', 'bg-brand-dark/40', 'text-gray-400');
                });
                btn.classList.add('active', 'border-brand-500', 'bg-brand-500/10', 'text-brand-600');
                btn.classList.remove('border-brand-border', 'bg-brand-dark/40', 'text-gray-400');
                state.shape = btn.dataset.shape;
                render();
            });
        });

        // Feather Slider
        const featherSlider = document.getElementById('featherSlider');
        const featherValue = document.getElementById('featherValue');
        featherSlider.addEventListener('input', (e) => {
            state.feather = parseInt(e.target.value);
            featherValue.textContent = `${state.feather} px`;
            render();
        });

        // Alignment Guides Toggle
        document.getElementById('toggleGuides').addEventListener('change', (e) => {
            state.showGuides = e.target.checked;
            render();
        });

        // Background Preview Switches
        document.querySelectorAll('.bg-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active', 'border-brand-500', 'bg-brand-500/10', 'text-brand-600'));
                btn.classList.add('active', 'border-brand-500', 'bg-brand-500/10', 'text-brand-600');
                state.bgPreview = btn.dataset.bg;
                render();
            });
        });

        // Quick Zoom Buttons
        document.getElementById('btnZoomIn').addEventListener('click', () => { state.zoom = Math.min(4, state.zoom + 0.2); render(); });
        document.getElementById('btnZoomOut').addEventListener('click', () => { state.zoom = Math.max(0.5, state.zoom - 0.2); render(); });
        document.getElementById('btnResetView').addEventListener('click', () => { state.zoom = 1; state.panX = 0; state.panY = 0; render(); });

        // Change Image Triggers
        document.getElementById('btnUploadNew').addEventListener('click', () => fileInput.click());
        document.getElementById('btnMobileUpload').addEventListener('click', () => fileInput.click());

        // Export Modal Control
        const exportModal = document.getElementById('exportModal');
        document.getElementById('btnExport').addEventListener('click', () => {
            if (!state.imageLoaded) return;
            exportModal.classList.remove('opacity-0', 'pointer-events-none');
        });

        document.getElementById('btnCloseModal').addEventListener('click', () => {
            exportModal.classList.add('opacity-0', 'pointer-events-none');
        });

        // EXPORT ENGINE: High Resolution Offscreen Render
        document.getElementById('btnConfirmDownload').addEventListener('click', () => {
            const format = document.querySelector('input[name="exportFormat"]:checked').value;
            const sizeOption = document.getElementById('exportSizeSelect').value;

            // 1. Calculate Full Native Resolution of Original Image
            let targetW = state.image.naturalWidth || state.image.width;
            let targetH = state.image.naturalHeight || state.image.height;

            if (sizeOption !== 'native') {
                targetW = parseInt(sizeOption);
                targetH = parseInt(sizeOption);
            }

            // 2. Setup Offscreen Canvas at full resolution
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = targetW;
            exportCanvas.height = targetH;
            const expCtx = exportCanvas.getContext('2d');

            // Set Highest Quality Smoothing
            expCtx.imageSmoothingEnabled = true;
            expCtx.imageSmoothingQuality = 'high';

            // 3. Draw Mask Clipping Path
            expCtx.save();
            expCtx.beginPath();
            drawMaskShape(expCtx, 0, 0, targetW, targetH, state.shape);

            if (state.feather > 0) {
                const scaleFactor = targetW / Math.min(canvas.width, canvas.height);
                expCtx.filter = `blur(${state.feather * scaleFactor}px)`;
            }

            expCtx.clip();

            // 4. Calculate precise Offscreen Zoom & Pan scale mapping
            const imgAspect = (state.image.naturalWidth || state.image.width) / (state.image.naturalHeight || state.image.height);
            let drawW = targetW * state.zoom;
            let drawH = drawW / imgAspect;

            if (drawH < targetH * state.zoom) {
                drawH = targetH * state.zoom;
                drawW = drawH * imgAspect;
            }

            const dpr = window.devicePixelRatio || 1;
            const previewWidth = canvas.width / dpr;
            const previewHeight = canvas.height / dpr;

            const scaleX = targetW / previewWidth;
            const scaleY = targetH / previewHeight;

            const centerX = targetW / 2 + (state.panX * scaleX);
            const centerY = targetH / 2 + (state.panY * scaleY);

            // 5. Draw Image at 100% Native Quality
            expCtx.drawImage(
                state.image, 
                centerX - drawW / 2, 
                centerY - drawH / 2, 
                drawW, 
                drawH
            );
            expCtx.restore();

            // 6. Trigger Native Lossless PNG Download
            const link = document.createElement('a');
            link.download = `logo-leire-transparent-hd.${format === 'ico' ? 'ico' : 'png'}`;
            link.href = exportCanvas.toDataURL('image/png', 1.0);
            link.click();

            exportModal.classList.add('opacity-0', 'pointer-events-none');
        });
    </script>
</body>
</html>
